<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <div class="header">
            <h1>Phantom Calc</h1>
        </div>

        <div class="prizes">
            <h2>What are you aimming for?</h2>
            <div class="prizes-grid" id="prizes-grid">
                
            </div>
        </div>

        <div class="calc">
            <h2>Your Goal</h2>
            <div class="calc-var">
                <p>Total fragments required <span id="required-hours">0</span></p>
            </div>
            <div class="calc-var">
                <p>Total hours required <span id="required-hours">0</span></p>
            </div>

            <div class="input">
                <label for="approved-hours">Approved hours</label>
                <input type="number", id="approved-hours", step="0.1", placeholder="Enter approved hours" >
            </div>

            <div class="calc-rslt">
                <p>Remaining hours <span id="remaining-hours">0</span></p>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
