<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Calc</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>Phantom Calc</h1>
        </div>

        <div class="prizes">
            <h2>What are you aimming for?</h2>
            <div class="prizes-grid" id="prizes-grid">

            </div>
        </div>

        <div class="calc">
            <h2>Your Goal</h2>
            <div class="calc-var">
                <p>Total fragments required <span id="total-fragments">0</span></p>
            </div>
            <div class="calc-var">
                <p>Total hours required <span id="required-hours">0</span></p>
            </div>

            <div class="input-group">
                <label for="approved-hours">Approved hours</label>
                <input type="number" id="approved-hours" step="0.1" placeholder="Enter approved hours" >
            </div>

            <div class="calc-rslt">
                <span>Remaining hours</span>
                <h2 id="remaining-hours"> 0 hours</h2>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
