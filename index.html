<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Calc</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-top">
                <h1>Phantom Calc</h1>

                <div class="phantom-status">
                    <div>
                        <p class="days-left"><span id="days-remaining">0</span> days left</p>
                        <p class="progress-label" id="progress-label">0% of Phantom complete</p>
                    </div>
                    <div class="progress-wrap">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>

        <div class="prizes">
            <h2>What are you aimming for?</h2>
            <div class="prizes-grid" id="prizes-grid">

            </div>
        </div>

        <div class="calc">
            <div class="calc-columns">
                <div class="calc-left">
                    <h2>Your Goal</h2>
                    <div class="calc-var">
                        <span>Total fragments required</span>
                        <span id="total-fragments">0</span>
                    </div>
                    <div class="calc-var">
                        <span>Total hours required</span>
                        <span id="required-hours">0</span>
                    </div>

                    <div class="input-group">
                        <label for="approved-hours">Approved hours</label>
                        <input type="number" id="approved-hours" min="0" step="0.1" placeholder="Enter approved hours">
                    </div>

                    <div class="calc-rslt">
                        <span>Remaining hours</span>
                        <h2 id="remaining-hours">0 hours</h2>
                    </div>
                </div>

                <div class="calc-right">
                    <h2>Per Day</h2>

                    <div class="per-day">
                        <span id="hours-per-day">0.0</span>
                        <span class="per-day-unit">hours / day</span>
                    </div>

                    <p class="per-day-note"><span id="days-to-code">0</span> days to code</p>

                    <div class="calendar">
                        <h3 id="calendar-title"></h3>
                        <div class="calendar-weekdays">
                            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                        </div>

                        <div class="calendar-grid" id="calendar-grid"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
